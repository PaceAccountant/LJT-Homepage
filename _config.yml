# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the 
# server process.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default" # The available themes options are "default", "air", "sunrise", "mint", "dirt" and "contrast"
title                    : "Junteng Liu"
title_separator          : "-"
name                     : &amp;name "Junteng Liu"
description              : &amp;description "Junteng Liu's academic homepage"
url                      : https://PaceAccountant.github.io
baseurl                  : "/LJT-Homepage"
repository               : "PaceAccountant/LJT-Homepage"

# Site Author
author:
  # Biographic information
  avatar           : "profile.png"
  name             : "Junteng Liu"
  pronouns         :
  bio              : "First-year PhD candidate at HKUST NLP Group."
  location         : "Hong Kong"
  employer         : "Hong Kong University of Science and Technology"
  uri              :
  email            : "jliugi@connect.ust.hk"

  # Academic websites
  academia         :
  arxiv            :
  googlescholar    : "https://scholar.google.com/citations?hl=en&amp;user=tbK9jl4AAAAJ&amp;view_op=list_works&amp;sortby=pubdate"
  inspire-hep      :
  impactstory      :
  orcid            :
  semantic         :
  ssrn             :
  pubmed           :
  researchgate     :
  scopus           :
  zotero           :


  # Repositories and software development
  bitbucket        :
  codepen          :
  dribbble         :
  github           : "Vicent0205"
  kaggle           :
  stackoverflow    :

  # Social media
  artstation       :
  bluesky          :
  facebook         :
  flickr           :
  foursquare       :
  goodreads        :
  google_plus      :
  keybase          :
  instagram        :
  lastfm           :
  linkedin         :
  mastodon         :
  medium           :
  pinterest        :
  soundcloud       :
  steam            :
  telegram         :
  tumblr           :
  twitter          : "junteng88716710"
  vine             :
  weibo            :
  wikipedia        :
  xing             :
  youtube          :
  zhihu            :

# Publication Category - The following the list of publication categories and their headings
publication_category:
  conferences:
    title: 'Conference Papers'
  manuscripts:
    title: 'Preprints'

# Site Settings
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               :
  disqus:
    shortname            :
  discourse:
    server               :
  facebook:
    appid                :
    num_posts            :
    colorscheme          :
staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601"
atom_feed:
  hide                   : false
  path                   :


# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :


# Social Sharing
twitter:
  username               : &amp;twitter "junteng88716710"
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 :
og_description           :
social:
  type                   :
  name                   :
  links:


# Analytics
analytics:
  provider               :  "false"
  google:
    tracking_id          :


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# These settings control the types of collections used by the template
collections:
  publications:
    output: true
    permalink: /:collection/:path/


# These settings control how pages and collections are included in the site
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed
  sass_options:
    cache_location: .sass-cache


# Outputting
permalink: /:categories/:title/
timezone: Asia/Hong_Kong


# Paginator
paginate: 5
paginate_path: /page:num/


# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate


# Archives
#  Type
#  - GitHub Pages compatible archive pages built with Liquid ~&gt; tag (default)
#  - "liquid" - built with Liquid ~&gt; tag (faster)
#  - false - disabled
#  Enabled (true) or disabled (false)
#  Permalink
#  - Set the permalink for the archive pages
#  - When using GitHub Pages / Liquid archives, the permalink must end with /
#
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/


# Theme tweaks
# Some elements of the theme can be tweaked to better suit your needs. For more
# information, see https://github.com/academicpages/academicpages.github.io/wiki/Theme-tweaks
#
# Theme tweaks are applied at build time, so you do not need to restart the
# server after changing them.
#
# The following tweaks are available:
#
# - `text`: The font family used for body text.
# - `heading`: The font family used for headings.
# - `monospace`: The font family used for monospace text.
# - `sans-serif`: The font family used for sans-serif text.
# - `serif`: The font family used for serif text.
#
# The default values are:
#
# text: "'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif"
# heading: "'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif"
# monospace: "'Courier New', Courier, monospace"
# sans-serif: "'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif"
# serif: "'Noto Serif', Georgia, 'Times New Roman', Times, serif"
#
# To use a different font family, set the corresponding tweak below.
# theme_tweaks:
#   text: "'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif"
#   heading: "'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif"
#   monospace: "'Courier New', Courier, monospace"
#   sans-serif: "'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif"
#   serif: "'Noto Serif', Georgia, 'Times New Roman', Times, serif"


# During build, this will enable the service to rebuild the site whenever a
# file is changed. This is useful for development.
# See https://jekyllrb.com/docs/configuration/options/#incremental-regeneration
incremental: false


# Set this to true if you are using a Jekyll plugin theme (like minimal-mistakes-jekyll)
# theme: minimal-mistakes-jekyll


# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development


# Category configurations
# Set the &quot;categories&quot; where you want your pages to appear. The category is
# used for grouping pages in the navigation and in the archives.
# Default is &quot;blog&quot;.
# categories:
#   - blog


# Theme
# theme: minimal-mistakes-jekyll


# jekyll-feed
# RSS feed is enabled by default. To disable it, set &quot;subscribe&quot; to false.
# subscribe: true


# Required packages
# gems:
#   - jekyll-feed
#   - jekyll-seo-tag
#   - jekyll-sitemap
